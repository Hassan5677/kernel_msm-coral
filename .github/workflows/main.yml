name: Build Pixel 4 Kernel (No Module Sig)

on:
  push:
    branches:
      - main # Adjust if your kernel source and defconfig are on a different branch
  workflow_dispatch: # Allows manual triggering from GitHub UI

env:
  # --- CUSTOMIZE THESE VARIABLES ---
  # KERNEL_DIR should now point to your 'kernel/msm-coral' directory
  KERNEL_DIR: kernel/msm-coral # THIS IS THE CRUCIAL CHANGE
  
  # floral_defconfig is already within the KERNEL_DIR at arch/arm64/configs/
  # So, we don't need to 'copy' it from an external path anymore.
  # We will just ensure the defconfig command targets it correctly.
  # You can remove FLORAL_DEFCONFIG_PATH if you want, but I'll keep it for clarity.
  FLORAL_DEFCONFIG_PATH: arch/arm64/configs/floral_defconfig 
  # --- END CUSTOMIZATION ---

  ARCH: arm64
  SUBARCH: arm64
  MAKEFLAGS: -j$(nproc)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y flex bison libssl-dev dwarves bc libelf-dev build-essential git ccache make automake autoconf libtool libncurses-dev

    - name: Set up Android NDK (Latest Stable)
      uses: android-actions/setup-android@v3
      with:
        android-version: 34

    - name: Configure Kernel
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        # No more 'cp' needed for floral_defconfig, as it's now in the correct
        # location relative to KERNEL_DIR.
        # Just ensure the defconfig targets the specific floral_defconfig
        # by making it the target for the defconfig command.
        echo "Applying floral_defconfig..."
        make O=out floral_defconfig # This directly uses floral_defconfig within KERNEL_DIR/arch/arm64/configs/

        # --- IMPORTANT: Verify CONFIG_MODULE_SIG=n ---
        echo "Verifying CONFIG_MODULE_SIG setting..."
        grep "CONFIG_MODULE_SIG" out/.config | tee module_sig_check.txt
        if grep -q "CONFIG_MODULE_SIG=y" out/.config; then
          echo "ERROR: CONFIG_MODULE_SIG is still 'y'. Please ensure 'arch/arm64/configs/floral_defconfig' sets it to 'n'."
          exit 1
        fi
        echo "Module signature verification confirmed DISABLED (CONFIG_MODULE_SIG=n or not set)."

    - name: Build Kernel and Modules
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        export PATH="${ANDROID_HOME}/ndk-bundle/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"
        export CROSS_COMPILE_ARM64="$(ls -d ${ANDROID_HOME}/ndk-bundle/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-* | head -1)"
        export CROSS_COMPILE="$(ls -d ${ANDROID_HOME}/ndk-bundle/toolchains/llvm/prebuilt/linux-x86_64/bin/arm-linux-androideabi-* | head -1)"

        echo "Using CROSS_COMPILE_ARM64: ${CROSS_COMPILE_ARM64}"
        echo "Using CROSS_COMPILE: ${CROSS_COMPILE}"
        clang --version

        make O=out ${{ env.MAKEFLAGS }} 2>&1 | tee build.log
        
        if grep -q "Error" build.log || grep -q "error:" build.log; then
            echo "::error::Kernel build failed! Check 'build.log' artifact for details."
            exit 1
        fi
        echo "Kernel and modules built successfully."

    - name: Create Kernel Image and Modules Archive
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        KERNEL_IMAGE_PATH=$(find out/arch/${{ env.ARCH }}/boot/ -maxdepth 1 -type f \( -name "Image.gz" -o -name "Image.lz4" -o -name "Image" \) -print -quit)
        
        if [ -z "${KERNEL_IMAGE_PATH}" ]; then
          echo "ERROR: No kernel image found in out/arch/${{ env.ARCH }}/boot/."
          echo "Please inspect the build.log for exact output paths."
          ls -l out/arch/${{ env.ARCH }}/boot/
          exit 1
        fi

        echo "Found kernel image: ${KERNEL_IMAGE_PATH}"
        
        # 'basename ${KERNEL_IMAGE_PATH}' ensures we just get "Image.gz" not "out/arch/arm64/boot/Image.gz"
        # when archiving from the 'out' directory.
        tar -czvf kernel_artifacts.tar.gz -C out/ "$(basename ${KERNEL_IMAGE_PATH})" modules_install_dir

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pixel4-floral-kernel-no-sig
        path: ${{ env.KERNEL_DIR }}/kernel_artifacts.tar.gz
        retention-days: 7
