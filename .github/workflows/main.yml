name: Build Pixel 4 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Pixel 4 Kernel (floral)
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      BUILD_USER: github_runner
      BUILD_HOST: github_actions

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential git

      - name: Clone AOSP Prebuilt Clang Toolchain
        run: |
          # Clone the AOSP prebuilts repository
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/  -b master --single-branch clang-prebuilts

          # Checkout the specific commit containing clang-r383902b
          cd clang-prebuilts
          git checkout 0e9e7035bf8ad42437c6156e5950eab13655b26c

          # Navigate back to the root directory
          cd ..

      - name: Configure Kernel
        run: |
          export PATH=$PWD/clang-prebuilts/clang-r383902b/bin:$PATH
          make O=out ARCH=arm64 floral_defconfig

      - name: Compile Kernel
        run: |
          export PATH=$PWD/clang-prebuilts/clang-r383902b/bin:$PATH
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package Artifacts
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image.lz4-dtb artifacts/ || true
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img artifacts/
          if [ -d out/lib/modules ]; then
            mkdir -p artifacts/modules
            cp -r out/lib/modules/* artifacts/modules/
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixel4-kernel-build
          path: artifacts
