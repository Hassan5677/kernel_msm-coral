name: Build Pixel 4 Kernel (Fixed VDSO32)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Kernel Build

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev \
            libelf-dev build-essential \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            lld llvm

      - name: Download clang toolchain
        run: |
          mkdir -p toolchains
          curl -L -o clang.tar.gz https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r416183b.tar.gz
          tar -xzf clang.tar.gz -C toolchains --strip-components=1

      - name: Export toolchain paths
        run: |
          echo "TOOLCHAIN_PATH=$GITHUB_WORKSPACE/toolchains/bin" >> $GITHUB_ENV

      - name: Configure kernel
        run: |
          export PATH=$TOOLCHAIN_PATH:$PATH
          make O=out ARCH=arm64 floral_defconfig

      - name: Build kernel
        run: |
          export PATH=$TOOLCHAIN_PATH:$PATH
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            AS=llvm-as \
            AS32=arm-linux-gnueabi-as \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Save artifacts
        run: |
          mkdir -p outdir
          cp out/arch/arm64/boot/Image.lz4-dtb outdir/ || true
          cp out/arch/arm64/boot/dtbo.img outdir/ || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: outdir
          
