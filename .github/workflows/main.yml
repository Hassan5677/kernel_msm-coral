name: Build Pixel 4 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Pixel 4 Kernel (floral)
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      BUILD_USER: github_runner
      BUILD_HOST: github_actions

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential curl git

      - name: Download & Extract Clang r416183b (working mirror)
        run: |
          mkdir -p toolchains
          curl -L -o clang.tar.gz https://commondatastorage.googleapis.com/android-ci/master-clang/clang-r416183b.tar.gz
          tar -xzf clang.tar.gz -C toolchains --strip-components=1

      - name: Configure Kernel (floral_defconfig)
        run: |
          export PATH=$PWD/toolchains/bin:$PATH
          make O=out ARCH=arm64 floral_defconfig

      - name: Compile Kernel
        run: |
          export PATH=$PWD/toolchains/bin:$PATH
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package Artifacts
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image.lz4-dtb artifacts/ || true
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img artifacts/
          if [ -d out/lib/modules ]; then
            mkdir -p artifacts/modules
            cp -r out/lib/modules/* artifacts/modules/
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixel4-kernel-build
          path: artifacts
          
