name: Build Pixel 4 Kernel (floral)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex git \
          libncurses5-dev libssl-dev libelf-dev lzop python3 unzip zip \
          gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu \
          binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
          llvm lld wget

    - name: Download Clang Toolchain
      run: |
        mkdir -p toolchains
        wget https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902b.tar.gz
        tar -xf clang-r383902b.tar.gz -C toolchains
        echo "TOOLCHAIN_PATH=$GITHUB_WORKSPACE/toolchains/clang-r383902b/bin" >> $GITHUB_ENV

    - name: Setup Output Directory
      run: mkdir -p out

    - name: Kernel Config (floral_defconfig)
      run: |
        export PATH=$TOOLCHAIN_PATH:$PATH
        make O=out ARCH=arm64 floral_defconfig
        # Disable VDSO32, compatibility, and module signature verification directly in .config
        echo "CONFIG_VDSO32=n" >> out/.config
        echo "CONFIG_COMPAT=n" >> out/.config
        echo "CONFIG_MODULE_SIG=n" >> out/.config
        # Ensure the configuration is updated
        make O=out ARCH=arm64 olddefconfig

    - name: Build Kernel (Force ld.lld, Avoid gold)
      run: |
        export PATH=$TOOLCHAIN_PATH:$PATH
        make -j$(nproc) O=out ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb
