name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Mark workspace as safe directory
      run: |
        git config --global --add safe.directory /github/workspace

    - name: Set up MemKernel as a module (M-OUT) with specified name
      run: |
        curl -LSs "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" | bash -s M

    - name: Android kernel build (Clang r383902b)
      uses: lemniskett/android-kernel-actions@master
      id: build_clang_383902b
      env:
        NAME: Loganysl
      with:
        arch: arm64
        compiler: clang-r383902b
        defconfig: floral_defconfig
        image: Image.gz-dtb
        # Specify the cross-compile prefix for arm32 if needed for this build, though arm64 is primary
        # cross_compile_arm32: arm-none-linux-gnueabihf- # This is a common prefix for arm32 GNU toolchains

    - name: Android kernel build (Clang r536225)
      uses: lemniskett/android-kernel-actions@master
      id: build_clang_536225
      env:
        NAME: Loganysl
      with:
        arch: arm64
        compiler: clang-r536225
        defconfig: floral_defconfig
        image: Image.gz-dtb
        # Specify the cross-compile prefix for arm32 if needed for this build, though arm64 is primary
        # cross_compile_arm32: arm-none-linux-gnueabihf- # This is a common prefix for arm32 GNU toolchains

    - name: Upload Kernel and Module (Clang r383902b)
      uses: actions/upload-artifact@v4
      with:
        name: module_clang_383902b
        path: |
          ${{ steps.build_clang_383902b.outputs.outfile }}
          ./out/drivers/memkernel/memkernel.ko # Assuming this path is consistent for both builds

    - name: Upload Kernel and Module (Clang r536225)
      uses: actions/upload-artifact@v4
      with:
        name: module_clang_536225
        path: |
          ${{ steps.build_clang_536225.outputs.outfile }}
          ./out/drivers/memkernel/memkernel.ko # Assuming this path is consistent for both builds

    # Add a job or step for building with arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu
    # This might require a separate `uses: lemniskett/android-kernel-actions@master` step
    # or modification of an existing one if the action supports specifying a custom toolchain path.
    - name: Android kernel build (GNU Toolchain 14.2)
      uses: lemniskett/android-kernel-actions@master
      id: build_gnu_toolchain
      env:
        NAME: Loganysl
      with:
        arch: arm64
        # For a custom GNU toolchain, you usually need to provide the full path to its bin directory
        # or rely on the action to install/configure it if it has pre-built support.
        # Since 'compiler' expects names like 'clang-rXXX', we might need a different approach
        # or check the action's documentation for custom toolchain support.
        # Assuming the action can infer from cross_compile if a pre-defined toolchain isn't used:
        cross_compile: aarch64-none-linux-gnu- # This matches the `arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu` prefix
        defconfig: floral_defconfig
        image: Image.gz-dtb
        # The action `lemniskett/android-kernel-actions` might need a specific `compiler` parameter,
        # or it might auto-detect if `cross_compile` is set.
        # If it doesn't support direct GNU toolchain specification this way,
        # you might need a custom `run` step to manually set up the environment
        # and invoke the kernel build commands.
        # For the purpose of "fixing all.yml", I'm assuming it can work with `cross_compile`.

    - name: Upload Kernel and Module (GNU Toolchain 14.2)
      uses: actions/upload-artifact@v4
      with:
        name: module_gnu_toolchain
        path: |
          ${{ steps.build_gnu_toolchain.outputs.outfile }}
          ./out/drivers/memkernel/memkernel.ko # Assuming this path is consistent for all builds
