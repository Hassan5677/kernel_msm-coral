name: Build Pixel 4 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Pixel 4 Kernel (floral)
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      BUILD_USER: github_runner
      BUILD_HOST: github_actions

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential curl git

      - name: Download & Extract Clang Toolchain
        run: |
          mkdir -p toolchains
          # Use a reliable Clang toolchain URL
          CLANG_URL="https://github.com/mvaisala/clang-builds/releases/download/continuous/clang-r416183b-arm64-linux-android.tar.xz "
          curl -L -o clang.tar.xz "$CLANG_URL"
          # Validate the downloaded file
          if ! file clang.tar.xz | grep -q 'XZ compressed data'; then
            echo "Download failed or not a valid .tar.xz file!"
            exit 1
          fi
          # Extract the toolchain
          tar -xf clang.tar.xz -C toolchains --strip-components=1

      - name: Configure Kernel
        run: |
          export PATH=$PWD/toolchains/bin:$PATH
          make O=out ARCH=arm64 floral_defconfig

      - name: Compile Kernel
        run: |
          export PATH=$PWD/toolchains/bin:$PATH
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package Artifacts
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image.lz4-dtb artifacts/ || true
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img artifacts/
          if [ -d out/lib/modules ]; then
            mkdir -p artifacts/modules
            cp -r out/lib/modules/* artifacts/modules/
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixel4-kernel-build
          path: artifacts
