name: Kernel Build2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Clone toolchains
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchains
        cd $GITHUB_WORKSPACE/toolchains
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b -b lineage-20.0 clang
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9   -b lineage-19.1 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9     -b lineage-19.1 gcc32

    - name: ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-kernel-${{ runner.os }}-${{ github.sha }}
        restore-keys: ccache-kernel-${{ runner.os }}-

    - name: Install build deps
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache bc bison flex libssl-dev libelf-dev

    - name: Set up MemKernel as module (M-OUT)
      run: |
        curl -LSs "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" | bash -s Y

    - name: Configure kernel
      run: |
        export ARCH=arm64 SUBARCH=arm64
        export CLANG_DIR=$GITHUB_WORKSPACE/toolchains/clang
        export GCC64_DIR=$GITHUB_WORKSPACE/toolchains/gcc64
        export GCC32_DIR=$GITHUB_WORKSPACE/toolchains/gcc32

        export PATH=$CLANG_DIR/bin:$PATH
        export LD_LIBRARY_PATH=$CLANG_DIR/lib:$LD_LIBRARY_PATH

        export LLVM=1
        export CROSS_COMPILE=$GCC64_DIR/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$GCC32_DIR/bin/arm-linux-androideabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export SKIP_ABI_CHECKS=true

        export CCACHE_DIR=~/.ccache
        ccache -M 5G
        ccache -z

        mkdir -p out
        make O=out LOCALVERSION=-MemKernel floral_defconfig

        ./scripts/config --file out/.config \
          --disable CONFIG_DTB_OVERLAY \
          --disable CONFIG_BUILD_ARM64_DT_OVERLAY \
          --enable  CONFIG_LTO_NONE \
          --disable CONFIG_LTO_CLANG \
          --disable CONFIG_LTO \
          --disable CONFIG_THINLTO \

          
          
         ./scripts/config --file out/.config \
          --disable CONFIG_MODULE_SIG \
          --disable CONFIG_MODULE_SIG_FORCE \
          --disable CONFIG_MODULE_SIG_ALL \
          --disable CONFIG_MODULE_SIG_SHA256 \
          --disable CONFIG_MODULE_SIG_KEY \



        make O=out LOCALVERSION=-MemKernel olddefconfig

    - name: Build kernel
      run: |
        export ARCH=arm64 SUBARCH=arm64
        export CLANG_DIR=$GITHUB_WORKSPACE/toolchains/clang
        export GCC64_DIR=$GITHUB_WORKSPACE/toolchains/gcc64
        export GCC32_DIR=$GITHUB_WORKSPACE/toolchains/gcc32

        export PATH=$CLANG_DIR/bin:$PATH
        export LD_LIBRARY_PATH=$CLANG_DIR/lib:$LD_LIBRARY_PATH

        export LLVM=1
        export CROSS_COMPILE=$GCC64_DIR/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$GCC32_DIR/bin/arm-linux-androideabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CCACHE_DIR=~/.ccache
        export CCACHE_COMPILERCHECK=content

        # reduce link-time memory
        export LDFLAGS="-Wl,--no-keep-memory -Wl,--reduce-memory-overheads"

        touch .scmversion

        # 1. compile in parallel  2. link single-threaded  3. modules in parallel
        make -C . O=out CC=clang LD=ld.lld LOCALVERSION=-MemKernel -j$(nproc)
        make -C . O=out CC=clang LD=ld.lld LOCALVERSION=-MemKernel -j1 vmlinux
        make -C . O=out CC=clang LD=ld.lld LOCALVERSION=-MemKernel -j$(nproc) modules

        ccache -s

    - name: Collect artifacts
      run: |
        # device-tree name varies; grab any that was built
        mkdir -p $GITHUB_WORKSPACE/artifacts
        cp out/arch/arm64/boot/Image* $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
        find out -name "*.ko" -exec cp {} $GITHUB_WORKSPACE/artifacts/ \;

    - name: Upload kernel and modules
      uses: actions/upload-artifact@v4
      with:
        name: compiled-kernel
        path: artifacts/*
