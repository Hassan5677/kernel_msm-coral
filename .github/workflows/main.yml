name: Build Pixel 4 Kernel (floral)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Debug: Git Info
      run: |
        git status
        git log -1

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex \
          libncurses5-dev libssl-dev libelf-dev lzop python3 unzip zip \
          gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu \
          binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
          llvm lld wget

    - name: Download Stable Clang Toolchain
      run: |
        mkdir -p toolchains
        cd toolchains
        # Using AOSP r450781d which is known to work well with Android kernels
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-13.0.0_r25/clang-r450781d.tar.gz -O clang.tar.gz
        tar -xf clang.tar.gz -C ./clang-r450781d
        echo "TOOLCHAIN_PATH=$GITHUB_WORKSPACE/toolchains/clang-r450781d/bin" >> $GITHUB_ENV

    - name: Debug: Check Toolchain Binaries
      run: |
        ls -la $TOOLCHAIN_PATH
        $TOOLCHAIN_PATH/clang --version

    - name: Setup Output Directory
      run: mkdir -p out

    - name: Configure Kernel (floral_defconfig)
      run: |
        export PATH=$TOOLCHAIN_PATH:$PATH
        make O=out ARCH=arm64 floral_defconfig
        scripts/config --file out/.config --disable MODULE_SIG --disable VDSO32
        make O=out ARCH=arm64 olddefconfig

    - name: Debug: Print Final Config
      run: cat out/.config

    - name: Build Kernel with Full Output
      run: |
        export PATH=$TOOLCHAIN_PATH:$PATH
        make -j$(nproc) O=out ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
          OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
          V=1 | tee build.log

    - name: Upload Build Log (for debug)
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    - name: Upload Image.gz-dtb
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb

    - name: Check for dtbo.img existence
      id: check_dtbo_img
      run: |
        if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
          echo "DTBO_IMG_EXISTS=true" >> "$GITHUB_OUTPUT"
        else
          echo "dtbo.img not found, skipping upload."
        fi

    - name: Upload dtbo.img artifact
      if: success() && steps.check_dtbo_img.outputs.DTBO_IMG_EXISTS == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: dtbo.img
        path: out/arch/arm64/boot/dtbo.img
