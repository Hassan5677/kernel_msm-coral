name: Build Pixel 4 Kernel (Floral)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex git \
          libncurses5-dev libssl-dev libelf-dev lzop python3 unzip zip \
          gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu \
          libstdc++6 python-is-python3

    - name: Download Clang Toolchain
      run: |
        mkdir -p toolchains
        wget https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r416183b.tar.gz
        tar -xf clang-r416183b.tar.gz -C toolchains
        echo "TOOLCHAIN_PATH=$GITHUB_WORKSPACE/toolchains/clang-r416183b/bin" >> $GITHUB_ENV

    - name: Setup Output Directory
      run: mkdir -p out

    - name: Kernel Config (floral_defconfig)
      run: |
        export PATH=$TOOLCHAIN_PATH:$PATH
        make O=out ARCH=arm64 floral_defconfig

    - name: Build Kernel
      run: |
        export PATH=$TOOLCHAIN_PATH:$PATH
        make -j$(nproc) O=out ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          CC=clang

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb
        
