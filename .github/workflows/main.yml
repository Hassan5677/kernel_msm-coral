name: Build Pixel 4 Kernel Image

on:
  push:
    branches:
      - main # Adjust if your kernel source and defconfig are on a different branch
  workflow_dispatch: # Allows manual triggering from GitHub UI

env:
  KERNEL_DIR: kernel/msm-coral # Directory containing the kernel source
  ARCH: arm64
  SUBARCH: arm64
  MAKEFLAGS: -j$(nproc)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y flex bison libssl-dev dwarves bc libelf-dev build-essential git ccache make automake autoconf libtool libncurses-dev

    - name: Set up Android NDK (Latest Stable)
      uses: android-actions/setup-android@v3
      with:
        ndk-version: r25c # Specify a stable NDK version
        cmake-version: latest
        ndk-api-level: 34

    - name: Configure Kernel
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        echo "Current working directory: $(pwd)"
        ls -lA .
        echo "Applying floral_defconfig..."
        make O=out floral_defconfig

    - name: Build Kernel
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        export PATH="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"
        export CROSS_COMPILE_ARM64="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-"
        export CROSS_COMPILE="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/arm-linux-androideabi-"

        echo "Using CROSS_COMPILE_ARM64: ${CROSS_COMPILE_ARM64}"
        echo "Using CROSS_COMPILE: ${CROSS_COMPILE}"
        clang --version

        make O=out ${{ env.MAKEFLAGS }} 2>&1 | tee build.log
        
        if grep -q "Error" build.log || grep -q "error:" build.log; then
            echo "::error::Kernel build failed! Check 'build.log' artifact for details."
            exit 1
        fi
        echo "Kernel built successfully."

    - name: Create Kernel Image Archive
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        KERNEL_IMAGE_PATH=$(find out/arch/${{ env.ARCH }}/boot/ -maxdepth 1 -type f \( -name "Image.gz" -o -name "Image.lz4" -o -name "Image" \) -print -quit)
        
        if [ -z "${KERNEL_IMAGE_PATH}" ]; then
          echo "ERROR: No kernel image found in out/arch/${{ env.ARCH }}/boot/."
          ls -l out/arch/${{ env.ARCH }}/boot/
          exit 1
        fi

        echo "Found kernel image: ${KERNEL_IMAGE_PATH}"
        
        tar -czvf kernel_image.tar.gz -C out/ "$(basename ${KERNEL_IMAGE_PATH})"

    - name: Upload Kernel Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pixel4-floral-kernel-image
        path: ${{ env.KERNEL_DIR }}/kernel_image.tar.gz
        retention-days: 7
