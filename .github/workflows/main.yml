name: Build Pixel 4 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential curl

      - name: Clone Clang Toolchain
        run: |
          mkdir -p toolchains
          cd toolchains
          git clone --depth=1 https://github.com/ClangBuiltLinux/google-clang.git clang
          cd ..

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_PATH=$(pwd)/toolchains/clang
          export PATH=$CLANG_PATH/bin:$PATH

          make O=out ARCH=arm64 floral_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Pixel4-Kernel
          path: out/arch/arm64/boot/Image.lz4-dtb
          
