name: Build Android Kernel

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KERNEL_ROOT: ${{ github.workspace }}
      ARCH: arm64
      KBUILD_BUILD_USER: "@ravindu644"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git device-tree-compiler lz4 xz-utils zlib1g-dev \
            openjdk-17-jdk gcc g++ python3 python-is-python3 \
            p7zip-full android-sdk-libsparse-utils erofs-utils \
            flex bison gperf build-essential zip curl libc6-dev \
            libncurses-dev libx11-dev libreadline-dev libgl1 \
            libgl1-mesa-dev make bc grep tofrodos python3-markdown \
            libxml2-utils xsltproc libtinfo6 cpio kmod openssl \
            libelf-dev pahole libssl-dev libarchive-tools zstd rsync \
            wget libyaml-dev

      - name: Setup Toolchains (Neutron & GCC)
        run: |
          mkdir -p ~/toolchains/neutron-clang ~/toolchains/gcc64 ~/toolchains/gcc32
          
          # Setup Neutron-Clang
          cd ~/toolchains/neutron-clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman && ./antman -S && ./antman --patch=glibc
          
          # Setup GCC 64-bit
          cd ~/toolchains/gcc64
          curl -LO "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"
          tar -xf arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz --strip-components=1
          
          # Setup GCC 32-bit (Required for VDSO/Compat)
          cd ~/toolchains/gcc32
          curl -LO "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-linux-gnueabihf.tar.xz"
          tar -xf arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-linux-gnueabihf.tar.xz --strip-components=1

      - name: Set environment variables
        run: |
          echo "NEUTRON_PATH=$HOME/toolchains/neutron-clang/bin" >> $GITHUB_ENV
          echo "PATH=$HOME/toolchains/neutron-clang/bin:$HOME/toolchains/gcc64/bin:$HOME/toolchains/gcc32/bin:$PATH" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$HOME/toolchains/gcc64/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=$HOME/toolchains/gcc32/bin/arm-none-linux-gnueabihf-" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          mkdir -p out build
          NEUTRON_BIN="$HOME/toolchains/neutron-clang/bin"
          
          BUILD_OPTIONS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE="${{ env.CROSS_COMPILE }}"
            CROSS_COMPILE_ARM32="${{ env.CROSS_COMPILE_ARM32 }}"
            CLANG_TRIPLE=aarch64-linux-gnu-
            AR="$NEUTRON_BIN/llvm-ar"
            NM="$NEUTRON_BIN/llvm-nm"
            LD="$NEUTRON_BIN/ld.lld"
            STRIP="$NEUTRON_BIN/llvm-strip"
            OBJCOPY="$NEUTRON_BIN/llvm-objcopy"
            OBJDUMP="$NEUTRON_BIN/llvm-objdump"
            READELF="$NEUTRON_BIN/llvm-readelf"
            HOSTCC=clang
            HOSTCXX=clang++
          )

          # Config and Build with log redirection
          make "${BUILD_OPTIONS[@]}" floral_defconfig
          make "${BUILD_OPTIONS[@]}" -j$(nproc) Image 2>&1 | tee build_output.log || {
            echo "FAILED" > status.txt
            grep -Ei "error:|warning:|fatal" build_output.log > error_only.log
            exit 1
          }
          
          cp out/arch/arm64/boot/Image build/

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: build/Image

      - name: Upload Error Logs Only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: error_only.log
          retention-days: 3
