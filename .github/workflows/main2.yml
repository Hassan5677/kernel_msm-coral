# .github/workflows/kernel_build.yml

name: Custom GrapheneOS MSM-Coral Kernel Build

on:
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - msm-coral_13 # Trigger on pushes to your specific kernel branch
  pull_request:
    branches:
      - msm-coral_13 # Trigger on pull requests to your specific kernel branch

env:
  # Environment variables for the build process
  ARCH: arm64
  KERNEL_DIR: msm-coral # Adjust if your repo sync places it differently (e.g., kernel/msm-coral)
  BUILD_CONFIG_PATH: private/msm-google/build.config.coral # VERIFY THIS PATH IN YOUR GRAPHENEOS KERNEL SOURCE
  # The output artifact name will include the run number and commit SHA
  ARTIFACT_NAME: kernel-msm-coral-${{ github.run_number }}-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-22.04 # Using a recent Ubuntu LTS for better compatibility

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch all history for proper git operations (e.g., KERNELRELEASE generation)
          fetch-depth: 0

      - name: Configure Git for Build
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          # Essential build tools for kernel compilation
          sudo apt-get install -y build-essential libncurses-dev flex bison bc kmod cpio git-lfs libssl-dev libelf-dev python3 python3-pip
          # Install dtc (Device Tree Compiler)
          sudo apt-get install -y device-tree-compiler
          # For LZ4/LZMA/LZO compression tools
          sudo apt-get install -y lz4 lzma lzop

      - name: Set up ccache (Optional, but good for faster rebuilds)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Initialize ccache
        run: |
          mkdir -p ~/.ccache
          echo "ccache -s"
          ccache -M 10G # Set ccache limit to 10GB
          export USE_CCACHE=1

      - name: Determine Kernel Source Directory
        id: kernel_src_path
        run: |
          # The repo sync might place the kernel in a subdirectory.
          # We need to find the actual 'arch' directory to proceed.
          # This assumes the GrapheneOS kernel repo contains the actual kernel sources directly.
          if [ -d "$GITHUB_WORKSPACE/arch/arm64" ]; then
            echo "KERNEL_SRC=$GITHUB_WORKSPACE" >> $GITHUB_ENV
            echo "::set-output name=path::$GITHUB_WORKSPACE"
          elif [ -d "$GITHUB_WORKSPACE/${{ env.KERNEL_DIR}}/arch/arm64" ]; then
            echo "KERNEL_SRC=$GITHUB_WORKSPACE/${{ env.KERNEL_DIR}}" >> $GITHUB_ENV
            echo "::set-output name=path::$GITHUB_WORKSPACE/${{ env.KERNEL_DIR}}"
          else
            echo "Error: Could not find kernel source directory (arch/arm64 not found)."
            exit 1
          fi
          echo "Discovered KERNEL_SRC: ${{ env.KERNEL_SRC }}"

      - name: Prepare Kernel Configuration
        working-directory: ${{ env.KERNEL_SRC }}
        run: |
          # Copy the default defconfig for coral
          cp arch/arm64/configs/coral_defconfig .config

          # --- Apply your specific CONFIG_MODULE_SIG=n change ---
          echo "Disabling CONFIG_MODULE_SIG..."
          sed -i 's/^CONFIG_MODULE_SIG=y/CONFIG_MODULE_SIG=n/' .config
          # Ensure it's not set to 'm' (module) either, if it somehow was
          sed -i 's/^CONFIG_MODULE_SIG=m/CONFIG_MODULE_SIG=n/' .config
          
          # Run olddefconfig to apply new settings and resolve dependencies
          make olddefconfig

          # Verify the change
          grep CONFIG_MODULE_SIG .config
          if ! grep -q "CONFIG_MODULE_SIG=n" .config; then
            echo "Error: CONFIG_MODULE_SIG=n was not successfully set in .config"
            exit 1
          fi

      - name: Build Kernel
        working-directory: ${{ env.KERNEL_SRC }}
        run: |
          echo "Starting kernel build..."
          # The GrapheneOS build script for coral should handle toolchain setup.
          # Ensure BUILD_CONFIG_PATH is correct for your GrapheneOS fork.
          BUILD_CONFIG=${{ env.BUILD_CONFIG_PATH }} ./build/build.sh

          # Verify build output
          if [ ! -f "out/android-msm-coral-4.14-android13/dist/Image.lz4-dtb" ] && \
             [ ! -f "out/android-msm-coral-4.14-android13/dist/Image.gz-dtb" ] && \
             [ ! -f "out/android-msm-coral-4.14-android13/dist/Image" ]; then
            echo "Error: Expected kernel image not found in 'out/android-msm-coral-4.14-android13/dist/'."
            echo "Listing contents of out/android-msm-coral-4.14-android13/dist/ for debugging:"
            ls -l out/android-msm-coral-4.14-android13/dist/
            exit 1
          fi
          echo "Kernel build completed successfully."

      - name: Collect Build Artifacts
        working-directory: ${{ env.KERNEL_SRC }}
        run: |
          # Create a directory for artifacts
          mkdir -p ../kernel_artifacts
          # Copy relevant files to the artifact directory
          find out/android-msm-coral-4.14-android13/dist/ -maxdepth 1 -type f -name "Image*" -exec cp {} ../kernel_artifacts/ \;
          find out/android-msm-coral-4.14-android13/dist/ -maxdepth 1 -type f -name "System.map*" -exec cp {} ../kernel_artifacts/ \;
          find out/android-msm-coral-4.14-android13/dist/ -maxdepth 1 -type f -name "*.dtb" -exec cp {} ../kernel_artifacts/ \;
          cp .config ../kernel_artifacts/grapheneos_coral_4.14_config_custom.txt
          echo "Collected artifacts:"
          ls -l ../kernel_artifacts/

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ github.workspace }}/kernel_artifacts/
          retention-days: 7 # Keep artifacts for 7 days
