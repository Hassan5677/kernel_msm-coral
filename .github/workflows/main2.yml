name: Build Android Kernel

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KERNEL_ROOT: ${{ github.workspace }}
      ARCH: arm64
      KBUILD_BUILD_USER: "@ravindu644"
    
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          echo -e "\n[INFO]: Installing dependencies...\n"
          sudo apt-get update
          sudo apt-get install -y \
            git device-tree-compiler lz4 xz-utils zlib1g-dev \
            openjdk-17-jdk gcc g++ python3 python-is-python3 \
            p7zip-full android-sdk-libsparse-utils erofs-utils \
            default-jdk git gnupg flex bison gperf build-essential \
            zip curl libc6-dev libncurses-dev libx11-dev \
            libreadline-dev libgl1 libgl1-mesa-dev python3 \
            make sudo bc grep tofrodos python3-markdown \
            libxml2-utils xsltproc zlib1g-dev libc6-dev \
            libtinfo6 make cpio kmod openssl libelf-dev \
            pahole libssl-dev libarchive-tools zstd rsync \
            wget libyaml-dev
          
          # Install libtinfo5 for older compatibility
          wget -q http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb || \
          wget -q http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.4-1_amd64.deb || \
          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
          sudo dpkg -i libtinfo5_*.deb || true
          
          echo -e "\n[INFO]: Dependencies installed successfully!\n"

      - name: Cache Neutron-Clang toolchain
        id: cache-neutron
        uses: actions/cache@v4
        with:
          path: ~/toolchains/neutron-clang
          key: ${{ runner.os }}-neutron-clang-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-neutron-clang-

      - name: Download and setup Neutron-Clang
        if: steps.cache-neutron.outputs.cache-hit != 'true'
        run: |
          echo -e "\n[INFO] Setting up Neutron-Clang Toolchain...\n"
          mkdir -p ~/toolchains/neutron-clang
          cd ~/toolchains/neutron-clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          bash antman -S
          bash antman --patch=glibc
          cd $KERNEL_ROOT

      - name: Cache GCC Toolchain
        id: cache-gcc
        uses: actions/cache@v4
        with:
          path: ~/toolchains/gcc
          key: ${{ runner.os }}-gcc-arm-14.2

      - name: Download and setup GCC
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          echo -e "\n[INFO] Setting up ARM GNU Toolchain...\n"
          mkdir -p ~/toolchains/gcc
          cd ~/toolchains/gcc
          curl -LO "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"
          tar -xf arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          cd $KERNEL_ROOT

      - name: Set environment variables
        run: |
          NEUTRON_PATH="$HOME/toolchains/neutron-clang/bin"
          echo "NEUTRON_PATH=$NEUTRON_PATH" >> $GITHUB_ENV
          echo "PATH=$NEUTRON_PATH:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$HOME/toolchains/neutron-clang/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "BUILD_CROSS_COMPILE=$HOME/toolchains/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV
          echo "BUILD_CC=$NEUTRON_PATH/clang" >> $GITHUB_ENV

      - name: Create output directories
        run: |
          mkdir -p out build

      - name: Build Kernel
        run: |
          echo -e "\n[INFO]: BUILD STARTED..!\n"
          
          # Set build options
          BUILD_OPTIONS=(
            -C "$KERNEL_ROOT"
            O="$KERNEL_ROOT/out"
            -j$(nproc)
            ARCH=arm64
            CROSS_COMPILE="${BUILD_CROSS_COMPILE}"
            CC="${BUILD_CC}"
            CLANG_TRIPLE=aarch64-linux-gnu-
            LLVM=1
            LLVM_IAS=1
            AR="${NEUTRON_PATH}/llvm-ar"
            NM="${NEUTRON_PATH}/llvm-nm"
            LD="${NEUTRON_PATH}/ld.lld"
            STRIP="${NEUTRON_PATH}/llvm-strip"
            OBJCOPY="${NEUTRON_PATH}/llvm-objcopy"
            OBJDUMP="${NEUTRON_PATH}/llvm-objdump"
            READELF="${NEUTRON_PATH}/llvm-readelf"
            HOSTCC="${NEUTRON_PATH}/clang"
            HOSTCXX="${NEUTRON_PATH}/clang++"
          )
          
          # Make default configuration with your defconfig
          make "${BUILD_OPTIONS[@]}" floral_defconfig
          
          # Note: menuconfig is skipped in CI as it's interactive
          # For custom configs, modify floral_defconfig or create a patch
          
          # Build the kernel
          make "${BUILD_OPTIONS[@]}" Image || { echo "Build failed!"; exit 1; }
          
          # Copy the built kernel
          cp "$KERNEL_ROOT/out/arch/arm64/boot/Image" "$KERNEL_ROOT/build/"
          
          echo -e "\n[INFO]: BUILD FINISHED..!\n"
          echo "Build artifacts:"
          ls -lh "$KERNEL_ROOT/build/"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            build/Image
            out/.config
            out/arch/arm64/boot/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: out/
          retention-days: 3
