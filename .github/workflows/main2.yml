name: Build Android Kernel

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KERNEL_ROOT: ${{ github.workspace }}
      ARCH: arm64
      KBUILD_BUILD_USER: "@ravindu644"
      USE_CCACHE: 1
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git git-lfs device-tree-compiler lz4 xz-utils zlib1g-dev \
            openjdk-17-jdk gcc g++ python3 python-is-python3 \
            p7zip-full android-sdk-libsparse-utils erofs-utils \
            flex bison gperf build-essential zip curl libc6-dev \
            libncurses-dev libx11-dev libreadline-dev libgl1 \
            libgl1-mesa-dev make bc grep tofrodos python3-markdown \
            libxml2-utils xsltproc libtinfo6 cpio kmod openssl \
            libelf-dev pahole libssl-dev libarchive-tools zstd rsync \
            wget libyaml-dev ccache

      - name: Setup Ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Setup Toolchains (pkm774 tools)
        run: |
          rm -rf tools
          git lfs install
          git clone --depth=1 https://github.com/pkm774/android-kernel-tools tools
          cd tools && git lfs pull && cd ..
          
          TOOLS_DIR="$(pwd)/tools"
          CLANG_DIR="$TOOLS_DIR/clang/host/linux-x86/clang-r416183b"
          GCC64_DIR="$TOOLS_DIR/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
          GCC32_DIR="$TOOLS_DIR/gcc/linux-x86/arm/arm-linux-androideabi-4.9"
          
          # Verify binaries
          if [ ! -f "$CLANG_DIR/bin/ld.lld" ]; then
            echo "ERROR: ld.lld still not found. LFS pull might have failed."
            exit 1
          fi
          chmod +x $CLANG_DIR/bin/* $GCC64_DIR/bin/* $GCC32_DIR/bin/*
          
          echo "CLANG_BIN=$CLANG_DIR/bin" >> $GITHUB_ENV
          echo "PATH=$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$CLANG_DIR/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          mkdir -p out build
          ccache -M 5G # Set cache size to 5GB
          
          BUILD_OPTIONS=(
            ARCH=arm64
            O=out
            CC="ccache clang"
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE="${{ env.CROSS_COMPILE }}"
            CROSS_COMPILE_ARM32="${{ env.CROSS_COMPILE_ARM32 }}"
            CLANG_TRIPLE=aarch64-linux-gnu-
            AR="${{ env.CLANG_BIN }}/llvm-ar"
            NM="${{ env.CLANG_BIN }}/llvm-nm"
            LD="${{ env.CLANG_BIN }}/ld.lld"
            STRIP="${{ env.CLANG_BIN }}/llvm-strip"
            OBJCOPY="${{ env.CLANG_BIN }}/llvm-objcopy"
            OBJDUMP="${{ env.CLANG_BIN }}/llvm-objdump"
            READELF="${{ env.CLANG_BIN }}/llvm-readelf"
            HOSTCC="ccache clang"
            HOSTCXX="ccache clang++"
          )

          make "${BUILD_OPTIONS[@]}" floral_defconfig
          make "${BUILD_OPTIONS[@]}" -j$(nproc) Image 2>&1 | tee build_output.log || {
            echo "FAILED" > status.txt
            grep -Ei "error:|warning:|fatal" build_output.log > error_only.log
            exit 1
          }
          
          # Show cache stats to see effectiveness
          ccache -s

          if [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image build/
          fi

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: build/Image

      - name: Upload Error Logs Only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: error_only.log
          retention-days: 3
