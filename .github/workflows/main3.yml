name: Kernel Build2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Remove KernelSU references (if not used)
      run: |
        # Remove kernelsu line from drivers/Kconfig to prevent build error
        if [ -f drivers/Kconfig ]; then
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig
          echo "Removed KernelSU reference from drivers/Kconfig"
        fi

    - name: Clone toolchains
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchains
        cd $GITHUB_WORKSPACE/toolchains
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b -b lineage-20.0 clang
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 -b lineage-19.1 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 -b lineage-19.1 gcc32

    - name: Setup swap space (8GB)
      run: |
        sudo swapoff -a
        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        sudo swapon --show
        free -h

    - name: ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-kernel-${{ runner.os }}-${{ github.sha }}
        restore-keys: ccache-kernel-${{ runner.os }}-

    - name: Install build deps
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache bc bison flex libssl-dev libelf-dev

    - name: Configure kernel
      run: |
        export ARCH=arm64 SUBARCH=arm64
        export CLANG_DIR=$GITHUB_WORKSPACE/toolchains/clang
        export GCC64_DIR=$GITHUB_WORKSPACE/toolchains/gcc64
        export GCC32_DIR=$GITHUB_WORKSPACE/toolchains/gcc32

        export PATH=$CLANG_DIR/bin:$PATH
        export LD_LIBRARY_PATH=$CLANG_DIR/lib:$LD_LIBRARY_PATH

        export LLVM=1
        export CROSS_COMPILE=$GCC64_DIR/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$GCC32_DIR/bin/arm-linux-androideabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export SKIP_ABI_CHECKS=true

        export CCACHE_DIR=~/.ccache
        ccache -M 5G
        ccache -z

        mkdir -p out
        
        # Use the defconfig
        make O=out floral_defconfig

        # Enable ThinLTO for better performance (saves RAM vs Full LTO)
        ./scripts/config --file out/.config \
          --disable CONFIG_LTO_NONE \
          --enable CONFIG_LTO_CLANG \
          --enable CONFIG_THINLTO \
          --disable CONFIG_LTO_CLANG_FULL \
          --disable CONFIG_DEBUG_INFO \
          --disable CONFIG_DEBUG_INFO_DWARF4 \
          --disable CONFIG_DEBUG_INFO_DWARF5 \
          --disable CONFIG_MODULE_SIG \
          --disable CONFIG_MODULE_SIG_FORCE \
          --disable CONFIG_MODULE_SIG_ALL \
          --disable CONFIG_MODULE_SIG_SHA256 \
          --disable CONFIG_MODULE_SIG_KEY \
          --disable CONFIG_DYNAMIC_DEBUG \
          --disable CONFIG_LKDTM \
          --disable CONFIG_CORESIGHT \
          --disable CONFIG_KSU \
          --disable CONFIG_KSU_DEBUG

        make O=out olddefconfig

    - name: Build kernel
      run: |
        export ARCH=arm64 SUBARCH=arm64
        export CLANG_DIR=$GITHUB_WORKSPACE/toolchains/clang
        export GCC64_DIR=$GITHUB_WORKSPACE/toolchains/gcc64
        export GCC32_DIR=$GITHUB_WORKSPACE/toolchains/gcc32

        export PATH=$CLANG_DIR/bin:$PATH
        export LD_LIBRARY_PATH=$CLANG_DIR/lib:$LD_LIBRARY_PATH

        export LLVM=1
        export CROSS_COMPILE=$GCC64_DIR/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$GCC32_DIR/bin/arm-linux-androideabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CCACHE_DIR=~/.ccache
        export CCACHE_COMPILERCHECK=content
        export PLATFORM_VERSION=13.0
        
        # Reduce linker memory usage during ThinLTO link stage
        export LDFLAGS="-Wl,--no-keep-memory -Wl,--reduce-memory-overheads"

        touch .scmversion

        # Build with ThinLTO - uses less RAM than Full LTO
        # -j2 is safer for GitHub Actions to prevent OOM during final link
        make -j2 O=out CC=clang LD=ld.lld
        
        ccache -s

    - name: Collect artifacts
      run: |
        mkdir -p $GITHUB_WORKSPACE/artifacts
        
        # Pixel 4 (floral) typically outputs Image.gz-dtb
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          cp out/arch/arm64/boot/Image.gz-dtb $GITHUB_WORKSPACE/artifacts/
          echo "Found Image.gz-dtb"
        elif [ -f out/arch/arm64/boot/Image.gz ]; then
          cp out/arch/arm64/boot/Image.gz $GITHUB_WORKSPACE/artifacts/
          echo "Found Image.gz"
        elif [ -f out/arch/arm64/boot/Image ]; then
          cp out/arch/arm64/boot/Image $GITHUB_WORKSPACE/artifacts/
          echo "Found Image"
        fi
        
        # Copy modules (if any are built as modules)
        find out -name "*.ko" -exec cp {} $GITHUB_WORKSPACE/artifacts/ \; 2>/dev/null || true
        
        # List what we found
        ls -lh $GITHUB_WORKSPACE/artifacts/

    - name: Upload kernel and modules
      uses: actions/upload-artifact@v4
      with:
        name: compiled-kernel
        path: artifacts/*
