name: Kernel Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-latest

    env:
      KERNEL_ROOT:   ${{ github.workspace }}
      OUT_DIR:       ${{ github.workspace }}/out
      ARCH:          arm64
      DEFCONFIG:     floral_defconfig
      JOBS:          6
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains
      CLANG_VER:     clang-r383902b
      GCC64_TAR:     arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
      GCC32_TAR:     arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-linux-gnueabihf.tar.xz

    steps:
    - name: Checkout sources
      uses: actions/checkout@v4

    - name: Inject fixed extable.c
      run: |
        mkdir -p kernel
        cat << 'EOF' > kernel/extable.c
// SPDX-License-Identifier: GPL-2.0-only
#include <linux/extable.h>
#include <linux/uaccess.h>
#include <linux/sort.h>
#include <linux/init.h>
#include <linux/module.h>
#include <linux/kernel.h>

extern struct exception_table_entry __start___ex_table[];
extern struct exception_table_entry __stop___ex_table[];

static bool main_extable_sort_needed __initdata;

static int cmp_ex(const void *a, const void *b)
{
    const struct exception_table_entry *x = a, *y = b;
    return x->insn - y->insn;
}

void __init sort_main_extable(void)
{
    if (main_extable_sort_needed && &__stop___ex_table[0] > &__start___ex_table[0]) {
        sort(__start___ex_table,
             __stop___ex_table - __start___ex_table,
             sizeof(struct exception_table_entry),
             cmp_ex, NULL);
    }
}

void __init prepare_exception_table(void)
{
    main_extable_sort_needed = true;
}
EOF

    - name: Install host packages
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends \
          git curl flex bison gperf build-essential bc \
          libncurses-dev lz4 xz-utils zstd p7zip-full \
          python3 python-is-python3 device-tree-compiler

    - name: Cache toolchains
      uses: actions/cache@v4
      with:
        path: ${{ env.TOOLCHAIN_DIR }}
        key: ${{ runner.os }}-${{ env.CLANG_VER }}-${{ hashFiles('.github/workflows/main.yml') }}

    - name: Fetch Clang
      if: steps.cache-toolchains.outputs.cache-hit != 'true'
      run: |
        mkdir -p ${TOOLCHAIN_DIR}/${CLANG_VER}
        curl -L \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/${CLANG_VER}.tar.gz \
        | tar -xz -C ${TOOLCHAIN_DIR}/${CLANG_VER}

    - name: Fetch GCC (aarch64 / arm32)
      if: steps.cache-toolchains.outputs.cache-hit != 'true'
      run: |
        mkdir -p ${TOOLCHAIN_DIR}/gcc64 ${TOOLCHAIN_DIR}/gcc32
        curl -L "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/${GCC64_TAR}" \
          | tar -xJ --strip-components=1 -C ${TOOLCHAIN_DIR}/gcc64
        curl -L "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/${GCC32_TAR}" \
          | tar -xJ --strip-components=1 -C ${TOOLCHAIN_DIR}/gcc32

    - name: Export toolchain paths
      run: |
        echo "PATH=${TOOLCHAIN_DIR}/${CLANG_VER}/bin:$PATH" >> $GITHUB_ENV
        echo "CROSS_COMPILE=${TOOLCHAIN_DIR}/gcc64/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=${TOOLCHAIN_DIR}/gcc32/bin/arm-none-linux-gnueabihf-" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "STRIP=llvm-strip" >> $GITHUB_ENV

    - name: Create output directory
      run: mkdir -p "${OUT_DIR}"

    - name: Run defconfig and disable module signature
      run: |
        make -C ${KERNEL_ROOT} O=${OUT_DIR} ARCH=${ARCH} ${DEFCONFIG}
        scripts/config --file ${OUT_DIR}/.config -d MODULE_SIG_ALL

    - name: Build Image
      run: |
        make -C ${KERNEL_ROOT} \
          O=${OUT_DIR} \
          ARCH=${ARCH} \
          LLVM_IAS=1 \
          -j${JOBS} \
          Image

    - name: Upload kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: ${{ env.OUT_DIR }}/arch/arm64/boot/Image
        retention-days: 7
        
